name: Local Supabase integration

on:
  push:
    branches: [main]
    paths:
      - 'packages/db/**'
      - 'supabase/**'
      - '.github/workflows/supabase-integration.yml'
  pull_request:
    paths:
      - 'packages/db/**'
      - 'supabase/**'
      - '.github/workflows/supabase-integration.yml'

permissions:
  contents: read

jobs:
  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize disposable local project and generate migration files
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force
          supabase migration new serveai_core
          cp packages/db/migrations/0001_core.sql "$(find supabase/migrations -maxdepth 1 -name '*_serveai_core.sql' -print -quit)"
          sleep 1
          supabase migration new serveai_tenant_read
          cp packages/db/migrations/0002_tenant_read_access.sql "$(find supabase/migrations -maxdepth 1 -name '*_serveai_tenant_read.sql' -print -quit)"
          sleep 1
          supabase migration new serveai_onboarding
          cp packages/db/migrations/0003_atomic_tenant_onboarding.sql "$(find supabase/migrations -maxdepth 1 -name '*_serveai_onboarding.sql' -print -quit)"
      - name: Start local Supabase and apply migrations
        run: supabase start
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Exercise Supabase Auth and RLS in isolated local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f packages/db/tests/supabase_integration.sql
      - name: Shut down disposable Supabase services
        if: always()
        run: supabase stop --no-backup || true
