name: Local Supabase integration

# Runs on every push and pull request so the `supabase-local` check always
# reports. The heavy Docker-based stack only starts when database files,
# Supabase config or this workflow change; otherwise the job passes quickly
# with a "skipped" note. This lets the check be made required later without
# blocking unrelated pull requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect database changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(packages/db/|supabase/|\.github/workflows/supabase-integration\.yml$)'; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
            echo "No database, Supabase or workflow changes. Integration stack skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Supabase CLI
        if: steps.changes.outputs.db == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Configure disposable local signup for CI
        if: steps.changes.outputs.db == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Email confirmation is on in the committed config. The disposable CI
          # stack turns it off so the HTTP test can sign in immediately.
          python3 - <<'PY'
          import re
          p = 'supabase/config.toml'
          s = open(p).read()
          i = s.index('[auth.email]')
          j = s.index('enable_confirmations = true', i)
          s = s[:j] + 'enable_confirmations = false' + s[j + len('enable_confirmations = true'):]
          open(p, 'w').write(s)
          PY
      - name: Start local Supabase and apply supabase/migrations
        if: steps.changes.outputs.db == 'true'
        run: supabase start
      - name: Ensure PostgreSQL client is available
        if: steps.changes.outputs.db == 'true'
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Exercise Supabase Auth and RLS in isolated local PostgreSQL
        if: steps.changes.outputs.db == 'true'
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f packages/db/tests/supabase_integration.sql
      - name: Verify Auth HTTP login, real JWT authorization and PostgREST RLS
        if: steps.changes.outputs.db == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(supabase status -o env)"
          anon_key="$(printf '%s\n' "$status_env" | sed -n 's/^ANON_KEY=//p' | tr -d '"')"
          if [ -z "$anon_key" ]; then echo 'Local anon key not available'; exit 1; fi
          SUPABASE_ANON_KEY="$anon_key" node packages/db/tests/http_auth_integration.mjs
      - name: Shut down disposable Supabase services
        if: always() && steps.changes.outputs.db == 'true'
        run: supabase stop --no-backup || true
