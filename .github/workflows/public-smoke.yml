name: Public pages without Supabase
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/e2e --ignore-scripts --no-audit --no-fund
      - run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Build with Supabase settings absent
        run: env -u NEXT_PUBLIC_SUPABASE_URL -u NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY npm run build
      - name: Browse public pages with Supabase settings absent
        run: env -u NEXT_PUBLIC_SUPABASE_URL -u NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY npm exec --prefix tests/e2e -- playwright test --config tests/e2e/public.config.mjs
