name: Temporary lockfile refresh (auth feature only)

on:
  push:
    branches: [feat/13-supabase-auth-onboarding-ui]
    paths:
      - '.github/workflows/temporary-auth-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/feat/13-supabase-auth-onboarding-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate npm lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(auth): refresh npm lockfile for Supabase SDKs'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
